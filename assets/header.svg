<svg xmlns="http://www.w3.org/2000/svg" width="900" height="280" viewBox="0 0 900 280" role="img" aria-label="Aizzul Luqman — XR Developer · SaaS Builder · AI Automation Explorer">
  <defs>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00F7FF"/>
      <stop offset=".55" stop-color="#7AA8FF"/>
      <stop offset="1" stop-color="#FF3DF5"/>
      <animateTransform attributeName="gradientTransform" type="translate"
        values="-0.15 0; 0.15 0; -0.15 0" dur="9s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="scanGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00F7FF" stop-opacity="0"/>
      <stop offset=".5" stop-color="#00F7FF" stop-opacity=".55"/>
      <stop offset="1" stop-color="#00F7FF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="floorFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00F7FF" stop-opacity="0"/>
      <stop offset="1" stop-color="#00F7FF" stop-opacity=".5"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- console panel -->
  <rect x="8" y="8" width="884" height="264" rx="18" fill="#0A0F1E" stroke="#223052"/>
  <rect x="8" y="8" width="884" height="264" rx="18" fill="none" stroke="#00F7FF" stroke-opacity=".14"/>

  <!-- corner brackets -->
  <path d="M 30 34 v -12 h 12 M 846 22 h 24 M 870 22 v 12 M 30 246 v 12 h 12 M 870 234 v 12 h -12"
        stroke="#FF3DF5" stroke-width="3" fill="none" opacity=".9"/>

  <!-- perspective grid floor -->
  <g stroke="#00F7FF" opacity=".28">
    <line x1="120" y1="272" x2="330" y2="188"/><line x1="300" y1="272" x2="395" y2="188"/>
    <line x1="450" y1="272" x2="450" y2="188"/><line x1="600" y1="272" x2="505" y2="188"/>
    <line x1="780" y1="272" x2="570" y2="188"/>
    <line x1="60" y1="206" x2="840" y2="206" stroke-opacity=".45"/>
    <line x1="30" y1="230" x2="870" y2="230" stroke-opacity=".7"/>
    <line x1="10" y1="258" x2="890" y2="258"/>
  </g>

  <!-- title -->
  <text x="450" y="122" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif"
        font-size="56" font-weight="800" letter-spacing="10" fill="url(#titleGrad)"
        filter="url(#softGlow)">AIZZUL LUQMAN</text>

  <!-- subtitle -->
  <text x="426" y="164" text-anchor="middle" font-family="'Courier New',monospace"
        font-size="17" font-weight="bold" letter-spacing="5" fill="#7BE9FF">XR DEVELOPER ✦ SAAS BUILDER ✦ AI AUTOMATION</text>
  <!-- blinking terminal cursor -->
  <rect x="668" y="150" width="11" height="19" fill="#00F7FF">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;.5;.5;1" dur="1.2s" repeatCount="indefinite"/>
  </rect>

  <!-- scanline sweep -->
  <rect x="0" y="16" width="110" height="248" fill="url(#scanGrad)" opacity=".16">
    <animate attributeName="x" values="-130;900" dur="6.5s" repeatCount="indefinite"/>
  </rect>

  <!-- status row -->
  <text x="52" y="212" font-family="'Courier New',monospace" font-size="13" letter-spacing="3" fill="#57F287">
    SYS.STATUS: ONLINE
    <animate attributeName="opacity" values="1;.35;1" dur="2.6s" repeatCount="indefinite"/>
  </text>
  <text x="52" y="236" font-family="'Courier New',monospace" font-size="13" letter-spacing="3" fill="#8FA3C8">LOC: MALAYSIA · UTC+8</text>
  <text x="848" y="212" text-anchor="end" font-family="'Courier New',monospace" font-size="13" letter-spacing="3" fill="#8FA3C8">BUILD: SHIPPING</text>
  <text x="848" y="236" text-anchor="end" font-family="'Courier New',monospace" font-size="13" letter-spacing="3" fill="#FF3DF5">MODE: BUIDL_IN_PUBLIC</text>

  <!-- top ticks -->
  <g stroke="#3A4E7A" stroke-width="2">
    <line x1="60" y1="40" x2="60" y2="48"/><line x1="80" y1="40" x2="80" y2="48"/><line x1="100" y1="40" x2="100" y2="48"/>
    <line x1="800" y1="40" x2="800" y2="48"/><line x1="820" y1="40" x2="820" y2="48"/><line x1="840" y1="40" x2="840" y2="48"/>
  </g>
</svg>
