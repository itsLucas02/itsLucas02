<svg xmlns="http://www.w3.org/2000/svg" width="900" height="180" viewBox="0 0 900 180" role="img" aria-label="Contribution snake — generated daily by GitHub Action">
  <rect width="900" height="180" fill="#0d1117"/>
  <text x="450" y="80" text-anchor="middle" font-family="'Courier New',monospace" font-size="14" fill="#8b949e">
    CONTRIBUTION SNAKE — generated daily
  </text>
  <text x="450" y="110" text-anchor="middle" font-family="'Courier New',monospace" font-size="11" fill="#30363d">
    The first run of the daily action will replace this placeholder
  </text>
  <circle cx="450" cy="145" r="4" fill="#39d353">
    <animate attributeName="opacity" values="1;.2;1" dur="2s" repeatCount="indefinite"/>
  </circle>
</svg>