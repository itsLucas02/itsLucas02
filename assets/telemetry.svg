<svg xmlns="http://www.w3.org/2000/svg" width="495" height="195" viewBox="0 0 495 195" role="img" aria-label="Live telemetry for itsLucas02: followers, repositories, stars, account age">
  <rect x="4" y="4" width="487" height="187" rx="14" fill="#0A0F1E" stroke="#223052"/>
